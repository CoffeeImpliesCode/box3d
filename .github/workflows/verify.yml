# Verification for the Zig package in this repository.
#
# Upstream ships `.github/workflows/build.yml`, a CMake matrix that builds
# upstream's own library, samples and tests. That file is upstream's and is left
# exactly as it is: it carries no secrets and touches no infrastructure of
# anybody's, so it is not a fork pipeline pointed at the wrong account. This
# file gates the fork's own artifacts and names this repository's commands.
#
# Five jobs, five different questions:
#   native         does the upstream C compile and link from this repository, do
#                  the facade tests, the smoke program and upstream's own
#                  twenty-one-file C unit-test program run on this host in both
#                  linkages and in all four optimize modes, and does the
#                  *installed* header and library serve a plain C program
#   native-options the three compile-time options that are upstream's own
#                  (`BOX3D_DOUBLE_PRECISION`, `BOX3D_DISABLE_SIMD`,
#                  `BOX3D_VALIDATE`) actually build and run, because each one
#                  selects a different compilation and a silently ignored
#                  option would look exactly like a working one
#   cross          does the whole package compile for each of the six matrix
#                  targets
#   cross-shared   the five matrix targets that have a dynamic linker, through
#                  -Dlinkage=dynamic, plus a step asserting that the sixth is
#                  refused with a message naming the platform fact
#   consumer       does the published module resolve from a package that did not
#                  write it
#
# There is no `continue-on-error` in this file and there is no matrix with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a gate run has printed
# the failure. If a target ever does turn out to be unsupported here, the honest
# edit is to replace that step with a command that asserts the specific
# documented failure and to record the run in FORK-NOTES.md, not to add a flag
# that hides it.
#
# There is deliberately no system-library mode step: this package has no system
# mode at all, so there is nothing to gate.
#
# The full platform matrix is a sixth gate and it is not in this file.
# `cross-test`, run from the package root, builds and *runs* `tests.zig` for
# every platform in Zig 0.16.0's published Tier 1/2 table through this
# repository's own build graph, using `cross-test.profile.sh` for its settings.
# It is not a job here because `cross-test` and its sibling helpers are a
# host-local tool with its own runner detection and its own scratch policy, not
# something a GitHub runner has. So this file does not pretend to cover it and
# does not stand in for it: the `cross` job below runs nothing, and a platform
# with no runner on the host is recorded as explicit `build_only` coverage,
# never as a pass.
#
# The runtime route (`-Druntime=true`) is compiled for one target here and
# nowhere executed. Its behavioural gates -- a failure that publishes nothing, a
# caller-driven retry, a second request for the provider already in use, many
# threads at one attempt, and the pre-readiness panic in all four optimize
# modes -- need a provider this file has no honest way to point at, and a step
# that asserted them without naming a provider would be a green that says
# nothing. `runtime/load_tests.zig` and `runtime/misuse.zig` are run by the
# driver against a provider it built; see README.zig.md.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests and installed C surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: immutable source integrity
        run: sha256sum -c UPSTREAM.sha256

      # The manifest's `.paths` is what a fetched copy receives. A file that is
      # tracked but unlisted is a file a `zig fetch` of this package silently
      # drops, and the failure it causes -- a missing include, a missing
      # integrity record -- shows up far from its cause.
      - name: every tracked file is inside build.zig.zon .paths
        run: |
          set -euo pipefail
          awk '/^    \.paths = \.\{$/{f=1;next} f&&/^    \},$/{f=0} f' build.zig.zon \
            | grep -oE '"[^"]+"' | tr -d '"' | sort -u > "$RUNNER_TEMP/listed.txt"
          test -s "$RUNNER_TEMP/listed.txt"
          missing=0
          while IFS= read -r file; do
            if ! grep -Fxq "$file" "$RUNNER_TEMP/listed.txt" \
               && ! awk -v p="$file" 'index(p "/", $0 "/") == 1 { found = 1 }
                                         END { exit !found }' "$RUNNER_TEMP/listed.txt"; then
              echo "not listed in build.zig.zon .paths: $file"
              missing=1
            fi
          done < <(git ls-files)
          exit "$missing"

      - name: build (default linkage)
        run: zig build --summary all

      # The installed closure is the deliverable, so the names in it are
      # asserted rather than assumed. `libbox3d.so.0.1.0`, the `libbox3d.so.0`
      # soname symlink and the `libbox3d.so` linker symlink are what upstream's
      # `VERSION ${PROJECT_VERSION}` / `SOVERSION ${PROJECT_VERSION_MAJOR}`
      # produce; the eight headers, the pkg-config file and the five licence
      # and provenance records are the rest of it.
      - name: installed closure, static
        run: |
          set -euo pipefail
          P="$PWD/zig-out"
          test -f "$P/lib/libbox3d.a"
          for h in base box3d collision config constants id math_functions types; do
            test -f "$P/include/box3d/$h.h"
          done
          test -f "$P/lib/pkgconfig/box3d.pc"
          for r in LICENSE README.upstream.md NOTICE.md UPSTREAM.md FORK-LICENSE.md; do
            test -f "$P/share/licenses/box3d/$r"
          done
          echo "--- installed tree"
          find "$P" -type f -o -type l | sort

      # A real gate for the installed C surface. It includes the *installed*
      # header and links the *installed* library, so a declaration the archive
      # does not define fails to link and a header that does not match the
      # compiled core fails to compile.
      #
      # Every answer it checks is upstream's own published expectation, copied
      # out of `docs/hello.md`: a unit cube created at y = 4 dropped for 90 steps
      # at 1/60 s with four sub-steps onto a static slab whose top surface is at
      # y = 0 comes to rest at approximately y = 1, because the cube's
      # half-height is 1. Nothing here asks whether two calls into this build
      # agree with each other, and nothing checks a version string or an export
      # list, so the program passes only by producing the motion upstream
      # documents.
      - name: installed C header compiles, links and runs against the archive
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'

          #include <box3d/box3d.h>

          #include <math.h>
          #include <stdio.h>

          int main(void)
          {
              b3WorldDef worldDef = b3DefaultWorldDef();
              worldDef.gravity = (b3Vec3){ 0.0f, -10.0f, 0.0f };
              b3WorldId worldId = b3CreateWorld(&worldDef);
              if (!b3World_IsValid(worldId)) {
                  fprintf(stderr, "world id is not valid\n");
                  return 1;
              }

              /* Static slab: half-extents 50, 10, 50 at y = -10, so its top
                 surface is exactly y = 0. */
              b3BodyDef groundBodyDef = b3DefaultBodyDef();
              groundBodyDef.position = (b3Vec3){ 0.0f, -10.0f, 0.0f };
              b3BodyId groundId = b3CreateBody(worldId, &groundBodyDef);
              b3BoxHull groundBox = b3MakeBoxHull(50.0f, 10.0f, 50.0f);
              b3ShapeDef groundShapeDef = b3DefaultShapeDef();
              b3CreateHullShape(groundId, &groundShapeDef, &groundBox.base);

              b3BodyDef bodyDef = b3DefaultBodyDef();
              bodyDef.type = b3_dynamicBody;
              bodyDef.position = (b3Vec3){ 0.0f, 4.0f, 0.0f };
              b3BodyId bodyId = b3CreateBody(worldId, &bodyDef);
              b3BoxHull dynamicBox = b3MakeCubeHull(1.0f);
              b3ShapeDef shapeDef = b3DefaultShapeDef();
              shapeDef.density = 1.0f;
              shapeDef.baseMaterial.friction = 0.3f;
              b3CreateHullShape(bodyId, &shapeDef, &dynamicBox.base);

              const float timeStep = 1.0f / 60.0f;
              const int subStepCount = 4;
              b3Vec3 position = b3Body_GetPosition(bodyId);
              float restY = 0.0f;
              for (int i = 0; i < 90; ++i)
              {
                  b3World_Step(worldId, timeStep, subStepCount);
                  position = b3Body_GetPosition(bodyId);
                  restY = position.y;
              }

              b3DestroyWorld(worldId);

              printf("final y = %.4f\n", (double)restY);

              /* Independent expectations, from docs/hello.md. */
              if (!(restY > 0.5f && restY < 1.5f)) {
                  fprintf(stderr, "the cube came to rest at y = %f, not at approximately 1\n",
                          (double)restY);
                  return 1;
              }
              if (!isfinite(position.x) || !isfinite(position.z)) {
                  fprintf(stderr, "the cube left the vertical axis\n");
                  return 1;
              }
              if (fabsf(position.x) > 1e-3f || fabsf(position.z) > 1e-3f) {
                  fprintf(stderr, "a cube dropped straight down drifted in x or z\n");
                  return 1;
              }
              return 0;
          }
          C
          P="$PWD/zig-out"
          test -f "$P/lib/libbox3d.a"
          zig cc -std=gnu17 -I "$P/include" "$RUNNER_TEMP/c_surface_gate.c" \
            "$P/lib/libbox3d.a" -lm -o "$RUNNER_TEMP/c_surface_gate"
          "$RUNNER_TEMP/c_surface_gate"

      # The `.pc` file is only real if pkg-config can answer from it and a C
      # consumer can be compiled with nothing but its output.
      - name: pkg-config metadata describes the installed package
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          pkg-config --exists box3d
          pkg-config --modversion box3d
          echo "cflags: $(pkg-config --cflags box3d)"
          echo "libs:   $(pkg-config --libs box3d)"
          pkg-config --variable=prefix box3d

      - name: pkg-config metadata drives a C consumer
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/zig-out/lib/pkgconfig"
          zig cc -std=gnu17 $(pkg-config --cflags box3d) \
            "$RUNNER_TEMP/c_surface_gate.c" $(pkg-config --libs box3d) \
            -o "$RUNNER_TEMP/pkgc_consumer"
          "$RUNNER_TEMP/pkgc_consumer"

      - name: test
        run: zig build test --summary all

      - name: smoke
        run: zig build smoke --summary all

      # Upstream's own C unit tests, built unmodified against the same archive
      # this package compiled. Their exit status is upstream's own report.
      - name: upstream's own C unit tests
        run: zig build upstream-test --summary all

      - name: test, ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: smoke, ReleaseSafe
        run: zig build smoke -Doptimize=ReleaseSafe --summary all

      - name: upstream's own C unit tests, ReleaseSafe
        run: zig build upstream-test -Doptimize=ReleaseSafe --summary all

      - name: test, ReleaseFast
        run: zig build test -Doptimize=ReleaseFast --summary all

      - name: upstream's own C unit tests, ReleaseFast
        run: zig build upstream-test -Doptimize=ReleaseFast --summary all

      - name: test, ReleaseSmall
        run: zig build test -Doptimize=ReleaseSmall --summary all

      - name: upstream's own C unit tests, ReleaseSmall
        run: zig build upstream-test -Doptimize=ReleaseSmall --summary all

      - name: consumer package
        run: zig build consumer --summary all

      # -Druntime=true compiles the facade against the generated dispatch and
      # links no library into it. Compiling it is the half a build graph can
      # prove; the behavioural half is the driver's, and the note at the top of
      # this file says why.
      - name: runtime route compiles (no gate on behaviour)
        run: zig build check -Druntime=true -Dtarget=x86_64-linux-gnu --summary all

      # Started from an empty prefix so the assertions below describe what this
      # configuration installed, not what the static build left beside it.
      - name: shared object build
        run: |
          rm -rf zig-out
          zig build --summary all -Dlinkage=dynamic

      - name: installed closure, shared
        run: |
          set -euo pipefail
          P="$PWD/zig-out"
          test -f "$P/lib/libbox3d.so.0.1.0"
          test -L "$P/lib/libbox3d.so.0"
          test -L "$P/lib/libbox3d.so"
          for h in base box3d collision config constants id math_functions types; do
            test -f "$P/include/box3d/$h.h"
          done
          test -f "$P/lib/pkgconfig/box3d.pc"
          grep -q -- '-DBOX3D_DLL' "$P/lib/pkgconfig/box3d.pc"
          echo "--- soname"
          readelf -d "$P/lib/libbox3d.so.0.1.0" | grep SONAME
          echo "--- exported public entry points (first 20)"
          nm -D --defined-only "$P/lib/libbox3d.so.0.1.0" | grep ' T b3' | head -20
          # Hidden visibility is upstream's own policy (src/CMakeLists.txt:105-106):
          # a cross-translation-unit internal must not be in the dynamic symbol
          # table, or the export surface is not the one BOX3D_EXPORT defines.
          if nm -D --defined-only "$P/lib/libbox3d.so.0.1.0" | grep -qE ' [Tt] b3ParallelForCallback| [Tt] b3AtomicAdd'; then
            echo "an internal symbol is exported; visibility policy is not applied"
            exit 1
          fi

      - name: installed C header compiles, links and runs against the shared object
        run: |
          set -euo pipefail
          P="$PWD/zig-out"
          zig cc -std=gnu17 -DBOX3D_DLL -I "$P/include" "$RUNNER_TEMP/c_surface_gate.c" \
            -L "$P/lib" -lbox3d -Wl,-rpath,"$P/lib" -lm -o "$RUNNER_TEMP/c_surface_gate_so"
          "$RUNNER_TEMP/c_surface_gate_so"

      - name: test, shared object
        run: zig build test -Dlinkage=dynamic --summary all

      - name: smoke, shared object
        run: zig build smoke -Dlinkage=dynamic --summary all

      - name: upstream's own C unit tests, shared object
        run: zig build upstream-test -Dlinkage=dynamic --summary all

      - name: test, shared object, ReleaseSafe
        run: zig build test -Dlinkage=dynamic -Doptimize=ReleaseSafe --summary all

      - name: test, shared object, ReleaseFast
        run: zig build test -Dlinkage=dynamic -Doptimize=ReleaseFast --summary all

      - name: test, shared object, ReleaseSmall
        run: zig build test -Dlinkage=dynamic -Doptimize=ReleaseSmall --summary all

  native-options:
    name: upstream's own compile-time options
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Each of these is an upstream CMake option (CMakeLists.txt:89, :91,
      # :118) with a real upstream default, so each selects a different
      # compilation. A gate that only ever builds the default proves nothing
      # about the other three.
      - name: double precision
        run: |
          zig build test upstream-test --summary all -Ddouble-precision=true
          zig build check -Ddouble-precision=true -Dtarget=x86_64-linux-gnu --summary all

      - name: scalar fallback
        run: |
          zig build test upstream-test --summary all -Ddisable-simd=true
          zig build check -Ddisable-simd=true -Dtarget=x86_64-linux-gnu --summary all

      - name: validation off
        run: |
          zig build test upstream-test --summary all -Dvalidate=false
          zig build check -Dvalidate=false -Dtarget=x86_64-linux-gnu --summary all

  cross:
    name: cross-target compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: check x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none --summary all

      - name: check x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dtarget=riscv64-linux-gnu --summary all

      # WASI is in this matrix as a static-linkage target, which is a full
      # configuration for it. Its shared variant is not available at all: there
      # is no dynamic linker on that OS, so `-Dlinkage=dynamic` is refused there
      # with a message naming the platform fact, and `cross-shared` below asserts
      # that refusal rather than building something else.
      - name: check wasm32-wasi
        run: zig build check -Dtarget=wasm32-wasi --summary all

  # The same matrix again through `-Dlinkage=dynamic`, and for the same reason
  # the `cross` job exists: a shared object is a new artifact class, not a
  # linkage flip, so "the static graph compiles for this target" says nothing
  # about whether the shared one does. Five separate steps, no matrix, and a
  # sixth step that asserts the documented refusal for the one platform with no
  # dynamic linker. That step replaces a matrix row, so it is not a target
  # quietly dropped: it names the platform, the reason and the command that
  # reproduces it.
  cross-shared:
    name: cross-target compile matrix, shared object
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: check x86_64-linux-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dlinkage=dynamic -Dtarget=aarch64-macos-none --summary all

      - name: check x86_64-windows-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dlinkage=dynamic -Dtarget=riscv64-linux-gnu --summary all

      - name: wasm32-wasi has no dynamic linker, so the shared variant is refused
        run: |
          # The refusal is a panic in the build script, so the message reaches
          # stderr through the build runner and the command exits non-zero.
          # `set -e` is not used around it: a non-zero exit is the assertion,
          # not a failure of this step.
          status=0
          zig build check -Dlinkage=dynamic -Dtarget=wasm32-wasi \
            > "$RUNNER_TEMP/wasi-shared.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/wasi-shared.log"
          if [ "$status" -eq 0 ]; then
            echo "expected -Dlinkage=dynamic to be refused for wasm32-wasi"
            exit 1
          fi
          for expected in \
            '-Dlinkage=dynamic is not supported for wasi' \
            'std.Target.DynamicLinker.kind is none for that OS' \
            'does not substitute a static archive' \
            'Build this target with -Dlinkage=static'; do
            if ! grep -qF "$expected" "$RUNNER_TEMP/wasi-shared.log"; then
              echo "the refusal did not say: $expected"
              exit 1
            fi
          done

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The consumer is its own `zig build`, run from inside `consumer/`, on
      # purpose: a manifest dependency from the library back to it would close a
      # cycle, and a consumer written inside the library would prove nothing
      # about what a dependent receives.
      - name: consumer resolves the published module and runs
        working-directory: consumer
        run: zig build run --summary all

      - name: consumer, ReleaseSafe
        working-directory: consumer
        run: zig build run -Doptimize=ReleaseSafe --summary all